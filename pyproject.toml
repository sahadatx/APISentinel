[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apisentinel"
version = "0.1.0"
description = "Scoped API security assessment workspace"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2", "pydantic-settings>=2.4,<3", "python-multipart>=0.0.9",
  "pwdlib[argon2]>=0.2,<1", "boto3>=1.34,<2", "psycopg[binary]>=3.2,<4",
  "httpx==0.28.1", "httpcore==1.0.9", "PyYAML>=6,<7", "jinja2>=3.1,<4", "cryptography>=42,<47",
  "reportlab>=4.2,<5", "Pillow>=10,<13"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<6", "ruff>=0.6,<1"]
browser-e2e = ["playwright>=1.45,<2"]

[project.scripts]
apisentinel = "apisentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]
